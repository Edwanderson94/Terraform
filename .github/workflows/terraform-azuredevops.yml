name: Terraform Azure DevOps

on:
  pull_request:
    branches: [master]
    paths:
      - "azure-devops/**"
      - ".github/workflows/terraform-azuredevops.yml"
      - "docs/github-actions.md"
  push:
    branches: [master]
    paths:
      - "azure-devops/**"
      - ".github/workflows/terraform-azuredevops.yml"
      - "docs/github-actions.md"
  workflow_dispatch:
    inputs:
      apply:
        description: "Aplicar o plano desta execução após aprovação do Environment"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: terraform-azuredevops-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.15.7"
  TERRAGRUNT_VERSION: "1.0.8"
  STACK_DIR: azure-devops/organizations/Tecnoform/projects/infraestructure
  # Keep GitHub Actions state isolated from the Azure DevOps bootstrap state.
  OCI_TF_STATE_BUCKET: gh-pipeline-tf-state

jobs:
  fmt:
    name: Terraform format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - run: terraform fmt -check -recursive -diff
        name: Check Terraform formatting
      - run: git diff --check
        name: Check whitespace

  validate:
    name: Terraform validate
    runs-on: ubuntu-24.04
    env:
      AZDO_ORG_SERVICE_URL: https://dev.azure.com/Tecnoform
      AZDO_PERSONAL_ACCESS_TOKEN: validation-only-placeholder
      OCI_REGION: us-ashburn-1
      OCI_OBJECT_STORAGE_NAMESPACE: validation-only
      OCI_TENANCY_OCID: ocid1.tenancy.oc1..aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      OCI_USER_OCID: ocid1.user.oc1..aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      OCI_FINGERPRINT: 00:11:22:33:44:55:66:77:88:99:aa:bb:cc:dd:ee:ff
      OCI_COMPARTMENT_ID: ocid1.compartment.oc1..aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      OCI_TF_STATE_BUCKET: validation-only
      AWS_ACCESS_KEY_ID: validation-only
      AWS_SECRET_ACCESS_KEY: validation-only
      AWS_SESSION_TOKEN: ""
      AWS_REGION: validation-only
      AWS_TF_STATE_BUCKET: validation-only
      AWS_TF_STATE_KEY: validation-only
      AWS_TF_STATE_MIGRATED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Install Terragrunt
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64" \
            --output /usr/local/bin/terragrunt
          chmod 0755 /usr/local/bin/terragrunt
      - name: Configure validation-only OCI key
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/oci-validation-key.pem"
          umask 077
          openssl genrsa -out "$key_path" 2048 2>/dev/null
          echo "OCI_private_key_path=$key_path" >> "$GITHUB_ENV"
      - name: Initialize without backend
        working-directory: ${{ env.STACK_DIR }}
        run: terragrunt init -backend=false -input=false
      - name: Validate Terraform configuration
        working-directory: ${{ env.STACK_DIR }}
        run: terragrunt validate
      - name: Check Terragrunt formatting
        working-directory: ${{ env.STACK_DIR }}
        run: terragrunt hcl fmt --check

  static:
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed Terraform state, plans, and keys
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(^|/)(terraform\.tfstate([^.].*)?|tfplan|backend\.tf|.*\.pem)$'
          if git ls-files | grep -E "$forbidden"; then
            echo "Sensitive Terraform or key material is tracked by Git." >&2
            exit 1
          fi
      - run: git diff --check
        name: Check repository whitespace

  plan:
    name: Terraform plan
    needs: [fmt, validate, static]
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      AZDO_ORG_SERVICE_URL: ${{ secrets.AZDO_ORG_SERVICE_URL }}
      AZDO_PERSONAL_ACCESS_TOKEN: ${{ secrets.AZDO_PERSONAL_ACCESS_TOKEN }}
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_OBJECT_STORAGE_NAMESPACE: ${{ secrets.OCI_OBJECT_STORAGE_NAMESPACE }}
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
      OCI_TF_STATE_MIGRATED: ${{ secrets.OCI_TF_STATE_MIGRATED }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_TF_STATE_BUCKET: ${{ secrets.AWS_TF_STATE_BUCKET }}
      AWS_TF_STATE_KEY: ${{ secrets.AWS_TF_STATE_KEY }}
      AWS_TF_STATE_MIGRATED: ${{ secrets.AWS_TF_STATE_MIGRATED }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Install Terragrunt
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64" \
            --output /usr/local/bin/terragrunt
          chmod 0755 /usr/local/bin/terragrunt
      - name: Require protected credentials and migrated backend
        run: |
          set -euo pipefail
          test -n "$AZDO_PERSONAL_ACCESS_TOKEN" || {
            echo "Configure AZDO_PERSONAL_ACCESS_TOKEN in GitHub Secrets." >&2
            exit 1
          }
          test "$OCI_TF_STATE_MIGRATED" = "true" || {
            echo "OCI_TF_STATE_MIGRATED must be true before plan/apply." >&2
            exit 1
          }
      - name: Configure OCI API key
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$OCI_PRIVATE_KEY" || {
            echo "Configure OCI_PRIVATE_KEY in GitHub Secrets." >&2
            exit 1
          }
          key_path="$RUNNER_TEMP/oci-api-key.pem"
          umask 077
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$key_path"
          echo "OCI_PRIVATE_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          echo "OCI_private_key_path=$key_path" >> "$GITHUB_ENV"
          echo "OCI_tenancy_ocid=$OCI_TENANCY_OCID" >> "$GITHUB_ENV"
          echo "OCI_user_ocid=$OCI_USER_OCID" >> "$GITHUB_ENV"
          echo "OCI_fingerprint=$OCI_FINGERPRINT" >> "$GITHUB_ENV"
          echo "OCI_region=$OCI_REGION" >> "$GITHUB_ENV"
      - name: Initialize configured backend
        working-directory: ${{ env.STACK_DIR }}
        run: terragrunt init -reconfigure -input=false
      - name: Require OCI backend
        working-directory: ${{ env.STACK_DIR }}
        run: |
          set -euo pipefail
          backend_file="$(find .terragrunt-cache -type f -name backend.tf -print -quit)"
          test -n "$backend_file" && grep -q 'backend "oci"' "$backend_file" || {
            echo "The effective Terraform backend is not OCI; plan is blocked." >&2
            echo "Configure and validate the remote OCI backend before enabling this workflow." >&2
            exit 1
          }
          terragrunt state pull >/dev/null
      - name: Create plan
        working-directory: ${{ env.STACK_DIR }}
        run: |
          set +e
          terragrunt plan -input=false -out=terraform.tfplan -detailed-exitcode
          status=$?
          if [ "$status" -gt 2 ]; then exit "$status"; fi
          plan_file="$(find .terragrunt-cache -type f -name terraform.tfplan -print -quit)"
          test -n "$plan_file" || {
            echo "Terragrunt did not produce a plan file." >&2
            exit 1
          }
          cp "$plan_file" terraform.tfplan
          echo "Terraform plan exit code: $status"
      - name: Upload reviewed plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}
          path: ${{ env.STACK_DIR }}/terraform.tfplan
          retention-days: 3
          if-no-files-found: error

  apply:
    name: Apply reviewed plan
    needs: [plan]
    if: github.event_name == 'workflow_dispatch' && inputs.apply == true
    runs-on: ubuntu-24.04
    environment: terraform-azuredevops-production
    env:
      AZDO_ORG_SERVICE_URL: ${{ secrets.AZDO_ORG_SERVICE_URL }}
      AZDO_PERSONAL_ACCESS_TOKEN: ${{ secrets.AZDO_PERSONAL_ACCESS_TOKEN }}
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_OBJECT_STORAGE_NAMESPACE: ${{ secrets.OCI_OBJECT_STORAGE_NAMESPACE }}
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
      OCI_TF_STATE_MIGRATED: ${{ secrets.OCI_TF_STATE_MIGRATED }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_TF_STATE_BUCKET: ${{ secrets.AWS_TF_STATE_BUCKET }}
      AWS_TF_STATE_KEY: ${{ secrets.AWS_TF_STATE_KEY }}
      AWS_TF_STATE_MIGRATED: ${{ secrets.AWS_TF_STATE_MIGRATED }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Install Terragrunt
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64" \
            --output /usr/local/bin/terragrunt
          chmod 0755 /usr/local/bin/terragrunt
      - name: Configure OCI API key
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$OCI_PRIVATE_KEY" || {
            echo "Configure OCI_PRIVATE_KEY in GitHub Secrets." >&2
            exit 1
          }
          key_path="$RUNNER_TEMP/oci-api-key.pem"
          umask 077
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$key_path"
          echo "OCI_PRIVATE_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          echo "OCI_private_key_path=$key_path" >> "$GITHUB_ENV"
          echo "OCI_tenancy_ocid=$OCI_TENANCY_OCID" >> "$GITHUB_ENV"
          echo "OCI_user_ocid=$OCI_USER_OCID" >> "$GITHUB_ENV"
          echo "OCI_fingerprint=$OCI_FINGERPRINT" >> "$GITHUB_ENV"
          echo "OCI_region=$OCI_REGION" >> "$GITHUB_ENV"
      - name: Require OCI backend
        working-directory: ${{ env.STACK_DIR }}
        run: |
          set -euo pipefail
          test "$OCI_TF_STATE_MIGRATED" = "true"
          terragrunt init -reconfigure -input=false
          backend_file="$(find .terragrunt-cache -type f -name backend.tf -print -quit)"
          test -n "$backend_file" && grep -q 'backend "oci"' "$backend_file" || {
            echo "The effective Terraform backend is not OCI; apply is blocked." >&2
            exit 1
          }
          terragrunt state pull >/dev/null
      - uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}
          path: ${{ env.STACK_DIR }}
      - name: Apply exact reviewed plan
        working-directory: ${{ env.STACK_DIR }}
        run: |
          set -euo pipefail
          if [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            # Imported secret values cannot be recovered through the Azure API.
            # Reject writes to the working AWS group until the original secret
            # source has been supplied. Inspect JSON through a pipe, never logs.
            aws_group_changes="$(terragrunt show -json "$GITHUB_WORKSPACE/$STACK_DIR/terraform.tfplan" | jq -r '
              any(.resource_changes[]?;
                .address == "module.azuredevops_aws_variablegroup.azuredevops_variable_group.this"
                and .change.actions != ["no-op"])
            ')"
            if [ "$aws_group_changes" != "false" ]; then
              echo "AWS Variable Group changes require its original credentials; apply blocked." >&2
              exit 1
            fi
          fi
          terragrunt apply -input=false terraform.tfplan
