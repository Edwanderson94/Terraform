name: Gitflow guardrails

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches:
      - master
      - "release/**"

permissions:
  contents: read

jobs:
  validate-branch-flow:
    name: Validate branch flow
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce feature/fix/docs to release and release to master
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$HEAD_REPOSITORY" != "$THIS_REPOSITORY" ]; then
            echo "Pull requests must originate in the canonical repository." >&2
            exit 1
          fi

          case "$BASE_BRANCH" in
            release/*)
              [[ "$BASE_BRANCH" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
                echo "Release targets must use release/<major>.<minor>.<patch>." >&2
                exit 1
              }
              [[ "$HEAD_BRANCH" =~ ^(feature|fix|docs)/.+$ ]] || {
                echo "Only feature/*, fix/*, or docs/* branches may target a release." >&2
                exit 1
              }
              ;;
            master)
              [[ "$HEAD_BRANCH" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ || "$HEAD_BRANCH" =~ ^hotfix/[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
                echo "Only release/<version> or hotfix/<version> may target master." >&2
                exit 1
              }
              ;;
            *)
              echo "Unsupported Gitflow target: $BASE_BRANCH" >&2
              exit 1
              ;;
          esac

          echo "Accepted Gitflow transition: $HEAD_BRANCH -> $BASE_BRANCH"

  tag-merged-release:
    name: Tag merged release
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'master' &&
      (startsWith(github.event.pull_request.head.ref, 'release/') || startsWith(github.event.pull_request.head.ref, 'hotfix/')) &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - name: Create immutable release tag
        env:
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          version="${SOURCE_BRANCH#*/}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release branch does not contain a semantic version: $SOURCE_BRANCH" >&2
            exit 1
          }
          tag="v$version"
          test "$(git rev-parse HEAD)" = "$MERGE_SHA" || {
            echo "Checked out commit is not the merged pull request commit." >&2
            exit 1
          }
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists; refusing to move or overwrite it." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$tag" --message "Release $tag" "$MERGE_SHA"
          git push origin "$tag"
